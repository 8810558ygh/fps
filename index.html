<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>双雄对决 - 回合打靶</title>
    <link rel="stylesheet" href="style.css">
    <base target="_blank">
    <style>
        html, body {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        canvas {
            touch-action: none;
            user-select: none;
        }
        .overlay {
            touch-action: auto;
        }
        .overlay button, .overlay .wbtn {
            touch-action: manipulation;
        }
        .weapon-btn {
            transition: all 0.2s;
        }
        .weapon-btn:hover {
            background: #3a5a7a !important;
            border-color: #ffd24a !important;
        }
        .hp-armor {
            display: flex;
            gap: 20px;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 2px 6px #000;
            color: #fff;
        }
        .hp-armor span {
            background: rgba(0,0,0,0.5);
            padding: 2px 12px;
            border-radius: 4px;
        }
        .hp-armor .hp-val { color: #7ee08a; }
        .hp-armor .armor-val { color: #6db3ff; }
    </style>
</head>
<body>

    <!-- ===== 横屏提示层（手机竖屏时显示，仅在游戏进行中） ===== -->
    <div id="rotateOverlay">
        <div class="rotate-icon">📱</div>
        <div class="rotate-text">请将手机横屏使用</div>
        <div class="rotate-sub">旋转后自动继续游戏</div>
    </div>

    <!-- ===== 大厅覆盖层（打开页面时显示的第一屏） ===== -->
    <div id="lobbyOverlay" class="overlay">
        <div class="lobby-glow"></div>
        <h1 class="lobby-title"><span class="b">双雄</span>对决</h1>
        <div class="lobby-sub">ROUND-BASED SHOOTING ARENA</div>
        <div class="lobby-desc">
            <p>每回合 5 秒准备阶段 · 击杀 / 被击杀即结束本回合</p>
            <p>先达到 10 次击杀者获胜</p>
        </div>
        <button class="btn lobby-btn" id="lobbyStartBtn">开 始 游 戏</button>
        <div class="lobby-footer">Three.js · 程序化音效与纹理</div>
    </div>

    <!-- ===== 小地图（游戏中显示） ===== -->
    <canvas id="minimap" style="display:none;"></canvas>

    <div id="timer" class="timer">5:00</div>

    <div id="hud1" class="hud" style="width:100%; left:0;">
        <div class="scope"><div class="ring"></div><div class="sh"></div><div class="sv"></div></div>
        <div class="dmgflash"></div>
        <div class="cross"><div class="hitmark"></div></div>
        <div class="score">0</div>
        <div class="feed"></div>
        <div class="centermsg"></div>
        <div class="subhint">点击屏幕锁定鼠标 · 左键开火 · 右键切换开镜 · B键换枪</div>
        <div class="bottom">
            <div class="hp-armor">
                <span class="hp-val">❤️ HP: <span id="hpText">100</span></span>
                <span class="armor-val">🛡️ 护甲: <span id="armorText">50</span></span>
            </div>
            <div class="ammo">30 <span class="rsv">/ 60</span></div>
        </div>
        <div class="wtag"></div>
    </div>

    <!-- ===== 移动端触控层（仅触摸设备显示） ===== -->
    <div id="mobile-controls" style="position:fixed;inset:0;z-index:20;pointer-events:none;display:none;">
        <!-- 左侧摇杆（移动） -->
        <div id="touch-left" style="position:absolute;left:20px;bottom:100px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.3);pointer-events:auto;touch-action:none;"></div>

        <!-- 右侧瞄准区（滑动视角） -->
        <div id="touch-right" style="position:absolute;right:0;top:0;width:60%;height:100%;pointer-events:auto;background:transparent;touch-action:none;"></div>

        <!-- 开火按钮（右下） -->
        <div id="btn-fire" style="position:absolute;right:20px;bottom:40px;width:90px;height:90px;border-radius:50%;background:rgba(255,50,50,0.7);border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;font-weight:bold;pointer-events:auto;box-shadow:0 4px 10px rgba(0,0,0,0.5);touch-action:manipulation;">
            开火
        </div>

        <!-- 功能按钮组（左下） -->
        <div style="position:absolute;left:20px;bottom:250px;display:flex;gap:12px;pointer-events:none;">
            <div id="btn-jump" style="pointer-events:auto;padding:10px 18px;background:rgba(0,0,0,0.6);border-radius:8px;color:#fff;border:1px solid #aaa;font-size:16px;touch-action:manipulation;">跳跃</div>
            <div id="btn-aim" style="pointer-events:auto;padding:10px 18px;background:rgba(0,0,0,0.6);border-radius:8px;color:#fff;border:1px solid #aaa;font-size:16px;touch-action:manipulation;">开镜</div>
            <div id="btn-reload" style="pointer-events:auto;padding:10px 18px;background:rgba(0,0,0,0.6);border-radius:8px;color:#fff;border:1px solid #aaa;font-size:16px;touch-action:manipulation;">换弹</div>
        </div>
    </div>

    <!-- 结束覆盖层 -->
    <div id="endOverlay" class="overlay">
        <h1 id="endTitle"><span class="b">蓝色</span>玩家获胜！</h1>
        <div class="finalscore" id="endScore">10 : 9</div>
        <button class="btn" id="againBtn">再 来 一 局</button>
    </div>

    <!-- 武器面板 -->
    <div id="weaponPanel" class="overlay" style="display:none; background:rgba(0,0,0,0.75); z-index:60; justify-content:center; align-items:center;">
        <div style="background:#1a2533; padding:30px 40px; border-radius:12px; border:1px solid #3a4a5e; text-align:center;">
            <h2 style="color:#ffd24a; margin-bottom:20px;">选择武器（准备阶段限定）</h2>
            <div style="display:flex; gap:20px; flex-wrap:wrap; justify-content:center;">
                <button class="weapon-btn" data-weapon="rifle" style="padding:12px 30px; background:#2a3a4a; border:1px solid #5a7a9a; border-radius:8px; color:#fff; font-size:18px; cursor:pointer;">
                    <div>狂徒</div>
                    <div style="font-size:12px; color:#9ab;">25发 · 高伤</div>
                </button>
                <button class="weapon-btn" data-weapon="sniper" style="padding:12px 30px; background:#2a3a4a; border:1px solid #5a7a9a; border-radius:8px; color:#fff; font-size:18px; cursor:pointer;">
                    <div>冥驹</div>
                    <div style="font-size:12px; color:#9ab;">5发 · 一枪致命</div>
                </button>
                <button class="weapon-btn" data-weapon="shotgun" style="padding:12px 30px; background:#2a3a4a; border:1px solid #5a7a9a; border-radius:8px; color:#fff; font-size:18px; cursor:pointer;">
                    <div>判官</div>
                    <div style="font-size:12px; color:#9ab;">5发 · 散射</div>
                </button>
                <button class="weapon-btn" data-weapon="odin" style="padding:12px 30px; background:#2a3a4a; border:1px solid #5a7a9a; border-radius:8px; color:#fff; font-size:18px; cursor:pointer;">
                    <div>奥丁</div>
                    <div style="font-size:12px; color:#9ab;">100发 · 越打越快</div>
                </button>
            </div>
            <div style="margin-top:15px; color:#8a9aaa; font-size:14px;">按 <kbd>B</kbd> 键关闭</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/textures.js"></script>
    <script src="js/scene.js"></script>
    <script src="js/player.js"></script>
    <script src="js/game.js"></script>
    <script src="js/hud.js"></script>
    <script src="js/input.js"></script>
    <script src="js/minimap.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
