    <base target="_blank">
    <style>
        html, body {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        canvas { touch-action: none; user-select: none; }
        .overlay { touch-action: auto; }
        .overlay button, .overlay .wbtn { touch-action: manipulation; }
        .weapon-btn { transition: all 0.2s; }
        .weapon-btn:hover { background: #3a5a7a !important; border-color: #ffd24a !important; }
        .hp-armor {
            display: flex; gap: 20px; font-size: 18px; font-weight: bold;
            text-shadow: 0 2px 6px #000; color: #fff;
        }
        .hp-armor span {
            background: rgba(0,0,0,0.5); padding: 2px 12px; border-radius: 4px;
        }
        .hp-armor .hp-val { color: #7ee08a; }
        .hp-armor .armor-val { color: #6db3ff; }

        #adsReticle {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 8px;
            height: 8px;
            margin: -4px 0 0 -4px;
            z-index: 14;
            display: none;
            pointer-events: none;
            border-radius: 50%;
            background: #ff2418;
            box-shadow:
                0 0 3px #ff2418,
                0 0 6px rgba(255, 36, 24, 0.9),
                0 0 12px rgba(255, 36, 24, 0.55);
        }
    </style>
</head>
<body>

         ★ 界面片段 —— 按"页面/层"拆成独立文件，同步注入到 body

    <!-- ============================================================
         ★ 依赖加载：本地优先，CDN 回退
         ============================================================ -->
    <script src="vendor/three.min.js"></script>
    <script>
        if (typeof THREE === 'undefined') {
            console.warn('[deps] 本地 three.js 未找到，回退到 cdnjs');
            document.write(
                '<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>'
            );
        }
    </script>

    <script src="vendor/cannon.min.js"></script>
    <script>
        if (typeof CANNON === 'undefined') {
            console.warn('[deps] 本地 cannon.js 未找到，回退到 cdnjs');
            document.write(
                '<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"><\/script>'
            );
        }
    </script>

    <script src="vendor/peerjs.min.js"></script>
    <script>
        if (typeof Peer === 'undefined') {
            console.warn('[deps] 本地 peerjs 未找到，回退到 unpkg');
            document.write(
                '<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"><\/script>'
            );
        }
    </script>

    <script>
    (function () {
        var missing = [];
        if (typeof THREE === 'undefined')  missing.push('three.js (r128)');
        if (typeof Peer  === 'undefined')  missing.push('peerjs (1.5.2)');
        if (typeof CANNON === 'undefined') missing.push('cannon.js (0.6.2)');

        if (missing.length > 0) {
            console.error('[deps] 缺少依赖:', missing);
            document.body.innerHTML =
                '<div style="' +
                    'display:flex;flex-direction:column;align-items:center;' +
                    'justify-content:center;height:100vh;color:#fff;' +
                    'font-family:\'Microsoft YaHei\',Arial,sans-serif;' +
                    'background:radial-gradient(ellipse at center,#16263a 0%,#08131f 75%);' +
                    'text-align:center;padding:0 24px;' +
                '">' +
                    '<h1 style="color:#ff7a6d;font-size:38px;letter-spacing:6px;margin-bottom:18px;">依赖加载失败</h1>' +
                    '<p style="color:#cfe0f0;font-size:16px;line-height:1.9;">' +
                        '缺少：<b style="color:#ffd24a;">' + missing.join('、') + '</b>' +
                    '</p>' +
                    '<p style="color:#9fb2c8;font-size:14px;line-height:2;margin-top:12px;max-width:520px;">' +
                        '请检查网络连接，或手动下载以下文件到 <code style="color:#6ee7b7;">vendor/</code> 目录：' +
                    '</p>' +
                    '<ul style="color:#9fb2c8;font-size:13px;text-align:left;line-height:2;' +
                        'background:rgba(0,0,0,0.3);padding:14px 26px;border-radius:8px;margin-top:14px;">' +
                        '<li>vendor/three.min.js &nbsp;←&nbsp; cdnjs three.js r128</li>' +
                        '<li>vendor/cannon.min.js &nbsp;←&nbsp; cdnjs cannon.js 0.6.2</li>' +
                        '<li>vendor/peerjs.min.js &nbsp;←&nbsp; unpkg peerjs 1.5.2</li>' +
                    '</ul>' +
                    '<button onclick="location.reload()" style="' +
                        'margin-top:28px;padding:12px 42px;font-size:16px;font-weight:700;' +
                        'color:#08131f;background:linear-gradient(180deg,#ffd24a,#f0a92e);' +
                        'border:none;border-radius:10px;letter-spacing:4px;cursor:pointer;' +
                    '">刷 新 重 试</button>' +
                '</div>';
            throw new Error('Missing dependencies: ' + missing.join(', '));
        }

        console.log('[deps] three.js r128 + cannon.js 0.6.2 + peerjs 1.5.2 已就绪');
    })();
    </script>

    <script>
    (function () {
        if (typeof HTMLCanvasElement === 'undefined') return;

        const _origGetContext = HTMLCanvasElement.prototype.getContext;

        HTMLCanvasElement.prototype.getContext = function (type, opts) {
            if (type === '2d') {
                opts = opts || {};
                if (opts.willReadFrequently === undefined) {
                    opts.willReadFrequently = true;
                }
            }
            return _origGetContext.call(this, type, opts);
        };

        console.log('[perf] Canvas2D willReadFrequently 已全局启用');
    })();
    </script>
